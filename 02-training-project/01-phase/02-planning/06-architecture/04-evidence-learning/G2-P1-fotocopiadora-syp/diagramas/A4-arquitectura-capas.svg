<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720"><rect width="100%" height="100%" fill="#ffffff"/><text x="550.0" y="25.5" font-family="Arial" font-size="16" text-anchor="middle" fill="#222" font-weight="bold">SyP Web · Arquitectura en capas (cliente-servidor, API REST con JSON)</text><rect x="40" y="50" width="760" height="100" rx="0" fill="#e3f2fd" stroke="#455a64" stroke-width="1.5"/><text x="56" y="75.5" font-family="Arial" font-size="14" text-anchor="start" fill="#222" font-weight="bold">Capa de presentación (navegador)</text><text x="56" y="118.0" font-family="Arial" font-size="11" text-anchor="start" fill="#222">Páginas HTML/CSS/JS sin framework · catálogo, carrito, checkout, servicio técnico, panel admin · service worker (caché)</text><path d="M420,150 L420,190" fill="none" stroke="#333" stroke-width="1.3"/><polygon points="415.0,179.0 420,190 425.0,179.0" fill="#333" stroke="#333"/><text x="530.0" y="174.0" font-family="Arial" font-size="10" text-anchor="middle" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke">llama solo a la capa de abajo</text><rect x="40" y="190" width="760" height="100" rx="0" fill="#e8f5e9" stroke="#455a64" stroke-width="1.5"/><text x="56" y="215.5" font-family="Arial" font-size="14" text-anchor="start" fill="#222" font-weight="bold">Capa de API REST (FastAPI)</text><text x="56" y="251.0" font-family="Arial" font-size="11" text-anchor="start" fill="#222">Routers: auth · products · orders · requests · quotes · counters · admin · system</text><text x="56" y="265.0" font-family="Arial" font-size="11" text-anchor="start" fill="#222">Middleware: autenticación JWT en cookie HttpOnly, CORS, límite de peticiones, validación Pydantic</text><path d="M420,290 L420,330" fill="none" stroke="#333" stroke-width="1.3"/><polygon points="415.0,319.0 420,330 425.0,319.0" fill="#333" stroke="#333"/><rect x="40" y="330" width="760" height="100" rx="0" fill="#fff8e1" stroke="#455a64" stroke-width="1.5"/><text x="56" y="355.5" font-family="Arial" font-size="14" text-anchor="start" fill="#222" font-weight="bold">Capa de servicios y dominio</text><text x="56" y="398.0" font-family="Arial" font-size="11" text-anchor="start" fill="#222">ServicioPedidos (fachada) · Pedido, Producto, Carrito, SolicitudServicio · MetodoPago (estrategia) · Notificador</text><path d="M420,430 L420,470" fill="none" stroke="#333" stroke-width="1.3"/><polygon points="415.0,459.0 420,470 425.0,459.0" fill="#333" stroke="#333"/><rect x="40" y="470" width="760" height="100" rx="0" fill="#fce4ec" stroke="#455a64" stroke-width="1.5"/><text x="56" y="495.5" font-family="Arial" font-size="14" text-anchor="start" fill="#222" font-weight="bold">Capa de persistencia</text><text x="56" y="538.0" font-family="Arial" font-size="11" text-anchor="start" fill="#222">RepositorioPedidos, repositorios de productos y solicitudes · ConexionBD (singleton)</text><rect x="300" y="620" width="240" height="60" rx="0" fill="#eceff1" stroke="#455a64" stroke-width="1.2"/><text x="420.0" y="647.0" font-family="Arial" font-size="12" text-anchor="middle" fill="#222" font-weight="bold">Base de datos relacional</text><text x="420.0" y="662.0" font-family="Arial" font-size="12" text-anchor="middle" fill="#222" font-weight="bold">SQLite (modo WAL) · syp.db</text><path d="M420,570 L420,620" fill="none" stroke="#333" stroke-width="1.3"/><polygon points="415.0,609.0 420,620 425.0,609.0" fill="#333" stroke="#333"/><text x="490.0" y="599.0" font-family="Arial" font-size="10" text-anchor="middle" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke">SQL parametrizado</text><rect x="860" y="330" width="200" height="60" rx="0" fill="#f5f5f5" stroke="#333333" stroke-width="1.2" stroke-dasharray="6,4"/><text x="960.0" y="357.0" font-family="Arial" font-size="12" text-anchor="middle" fill="#222">Pasarela de pagos</text><text x="960.0" y="372.0" font-family="Arial" font-size="12" text-anchor="middle" fill="#222">(externa)</text><rect x="860" y="420" width="200" height="60" rx="0" fill="#f5f5f5" stroke="#333333" stroke-width="1.2" stroke-dasharray="6,4"/><text x="960.0" y="447.0" font-family="Arial" font-size="12" text-anchor="middle" fill="#222">Servidor de correo SMTP</text><text x="960.0" y="462.0" font-family="Arial" font-size="12" text-anchor="middle" fill="#222">(externo)</text><path d="M800,350 L860,360" fill="none" stroke="#333" stroke-width="1.3"/><polygon points="848.3,363.1 860,360 850.0,353.3" fill="#333" stroke="#333"/><text x="830.0" y="349.0" font-family="Arial" font-size="10" text-anchor="middle" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke">HTTPS</text><path d="M800,380 L860,450" fill="none" stroke="#333" stroke-width="1.3"/><polygon points="849.0,444.9 860,450 856.6,438.4" fill="#333" stroke="#333"/><text x="840.0" y="429.0" font-family="Arial" font-size="10" text-anchor="middle" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke">SMTP+TLS</text><text x="836" y="534.0" font-family="Arial" font-size="11" text-anchor="start" fill="#222">Reglas del estilo:</text><text x="836" y="548.0" font-family="Arial" font-size="11" text-anchor="start" fill="#222">• Cada capa usa solo la de abajo</text><text x="836" y="562.0" font-family="Arial" font-size="11" text-anchor="start" fill="#222">  (sin saltos: la presentación</text><text x="836" y="576.0" font-family="Arial" font-size="11" text-anchor="start" fill="#222">  nunca toca la base de datos).</text><text x="836" y="590.0" font-family="Arial" font-size="11" text-anchor="start" fill="#222">• Comunicación presentación ↔ API:</text><text x="836" y="604.0" font-family="Arial" font-size="11" text-anchor="start" fill="#222">  HTTP/HTTPS con JSON (REST).</text><text x="836" y="618.0" font-family="Arial" font-size="11" text-anchor="start" fill="#222">• Los sistemas externos se</text><text x="836" y="632.0" font-family="Arial" font-size="11" text-anchor="start" fill="#222">  alcanzan solo desde la capa</text><text x="836" y="646.0" font-family="Arial" font-size="11" text-anchor="start" fill="#222">  de servicios, mediante</text><text x="836" y="660.0" font-family="Arial" font-size="11" text-anchor="start" fill="#222">  adaptadores (MetodoPago,</text><text x="836" y="674.0" font-family="Arial" font-size="11" text-anchor="start" fill="#222">  Notificador).</text></svg>