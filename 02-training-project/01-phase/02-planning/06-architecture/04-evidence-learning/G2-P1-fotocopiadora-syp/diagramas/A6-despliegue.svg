t-family="Arial" font-size="12" text-anchor="middle" fill="#222" font-weight="bold">«execution environment»</text><text x="610.0" y="126.0" font-family="Arial" font-size="12" text-anchor="middle" fill="#222" font-weight="bold">Servidor de aplicación (Render, Python 3.12)</text><rect x="464" y="138" width="292" height="28" rx="0" fill="#ffffff" stroke="#90a4ae" stroke-width="1.2"/><text x="610.0" y="155.5" font-family="Arial" font-size="10" text-anchor="middle" fill="#222">«artifact» Uvicorn + FastAPI (main.py)</text><rect x="464" y="172" width="292" height="28" rx="0" fill="#ffffff" stroke="#90a4ae" stroke-width="1.2"/><text x="610.0" y="189.5" font-family="Arial" font-size="10" text-anchor="middle" fill="#222">«artifact» routers/*.py, security.py</text><rect x="464" y="206" width="292" height="28" rx="0" fill="#ffffff" stroke="#90a4ae" stroke-width="1.2"/><text x="610.0" y="223.5" font-family="Arial" font-size="10" text-anchor="middle" fill="#222">«artifact» archivos estáticos del sitio</text><rect x="464" y="240" width="292" height="28" rx="0" fill="#ffffff" stroke="#90a4ae" stroke-width="1.2"/><text x="610.0" y="257.5" font-family="Arial" font-size="10" text-anchor="middle" fill="#222">«artifact» health check /api/v1/health</text><rect x="482" y="408" width="280" height="160" rx="0" fill="#cfd8dc" stroke="#455a64" stroke-width="1.2"/><rect x="470" y="420" width="280" height="160" rx="0" fill="#fce4ec" stroke="#455a64" stroke-width="1.5"/><text x="610.0" y="441.0" font-family="Arial" font-size="12" text-anchor="middle" fill="#222" font-weight="bold">«device» Nodo de datos</text><text x="610.0" y="456.0" font-family="Arial" font-size="12" text-anchor="middle" fill="#222" font-weight="bold">(disco persistente montado)</text><rect x="484" y="468" width="252" height="28" rx="0" fill="#ffffff" stroke="#90a4ae" stroke-width="1.2"/><text x="610.0" y="485.5" font-family="Arial" font-size="10" text-anchor="middle" fill="#222">«artifact» syp.db (SQLite WAL)</text><rect x="484" y="502" width="252" height="28" rx="0" fill="#ffffff" stroke="#90a4ae" stroke-width="1.2"/><text x="610.0" y="519.5" font-family="Arial" font-size="10" text-anchor="middle" fill="#222">«artifact» carpeta de respaldos locales</text><rect x="892" y="408" width="280" height="160" rx="0" fill="#cfd8dc" stroke="#455a64" stroke-width="1.2"/><rect x="880" y="420" width="280" height="160" rx="0" fill="#fff8e1" stroke="#455a64" stroke-width="1.5"/><text x="1020.0" y="441.0" font-family="Arial" font-size="12" text-anchor="middle" fill="#222" font-weight="bold">«node» Almacenamiento de respaldo</text><text x="1020.0" y="456.0" font-family="Arial" font-size="12" text-anchor="middle" fill="#222" font-weight="bold">(nube, otra región)</text><rect x="894" y="468" width="252" height="28" rx="0" fill="#ffffff" stroke="#90a4ae" stroke-width="1.2"/><text x="1020.0" y="485.5" font-family="Arial" font-size="10" text-anchor="middle" fill="#222">«artifact» copias diarias cifradas</text><rect x="894" y="502" width="252" height="28" rx="0" fill="#ffffff" stroke="#90a4ae" stroke-width="1.2"/><text x="1020.0" y="519.5" font-family="Arial" font-size="10" text-anchor="middle" fill="#222">«artifact» retención 30 días</text><rect x="892" y="78" width="280" height="110" rx="0" fill="#cfd8dc" stroke="#455a64" stroke-width="1.2"/><rect x="880" y="90" width="280" height="110" rx="0" fill="#f5f5f5" stroke="#455a64" stroke-width="1.5"/><text x="1020.0" y="118.5" font-family="Arial" font-size="12" text-anchor="middle" fill="#222" font-weight="bold">«node» Servidor SMTP (externo)</text><rect x="894" y="138" width="252" height="28" rx="0" fill="#ffffff" stroke="#90a4ae" stroke-width="1.2"/><text x="1020.0" y="155.5" font-family="Arial" font-size="10" text-anchor="middle" fill="#222">«artifact» servicio de correo transaccional</text><rect x="892" y="238" width="280" height="110" rx="0" fill="#cfd8dc" stroke="#455a64" stroke-width="1.2"/><rect x="880" y="250" width="280" height="110" rx="0" fill="#f5f5f5" stroke="#455a64" stroke-width="1.5"/><text x="1020.0" y="278.5" font-family="Arial" font-size="12" text-anchor="middle" fill="#222" font-weight="bold">«node» Pasarela de pagos (externa)</text><rect x="894" y="298" width="252" height="28" rx="0" fill="#ffffff" stroke="#90a4ae" stroke-width="1.2"/><text x="1020.0" y="315.5" font-family="Arial" font-size="10" text-anchor="middle" fill="#222">«artifact» API de pagos (modo prueba)</text><path d="M310,200 L450,200" fill="none" stroke="#333" stroke-width="1.3"/><polygon points="439.0,205.0 450,200 439.0,195.0" fill="#333" stroke="#333"/><text x="380.0" y="186.0" font-family="Arial" font-size="10" text-anchor="middle" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke">HTTPS · TCP 443</text><text x="380.0" y="198.0" font-family="Arial" font-size="10" text-anchor="middle" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke">(TLS 1.2+)</text><path d="M610,320 L610,420" fill="none" stroke="#333" stroke-width="1.3"/><polygon points="605.0,409.0 610,420 615.0,409.0" fill="#333" stroke="#333"/><text x="680.0" y="370.0" font-family="Arial" font-size="10" text-anchor="middle" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke">E/S de archivo local</text><text x="680.0" y="382.0" font-family="Arial" font-size="10" text-anchor="middle" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke">(montaje /var/data)</text><path d="M770,150 L880,150" fill="none" stroke="#333" stroke-width="1.3"/><polygon points="869.0,155.0 880,150 869.0,145.0" fill="#333" stroke="#333"/><text x="825.0" y="136.0" font-family="Arial" font-size="10" text-anchor="middle" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke">SMTP STARTTLS</text><text x="825.0" y="148.0" font-family="Arial" font-size="10" text-anchor="middle" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke">TCP 587</text><path d="M770,290 L880,300" fill="none" stroke="#333" stroke-width="1.3"/><polygon points="868.6,304.0 880,300 869.5,294.0" fill="#333" stroke="#333"/><text x="825.0" y="287.0" font-family="Arial" font-size="10" text-anchor="middle" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke">HTTPS · TCP 443</text><path d="M750,500 L880,500" fill="none" stroke="#333" stroke-width="1.3"/><polygon points="869.0,505.0 880,500 869.0,495.0" fill="#333" stroke="#333"/><text x="815.0" y="486.0" font-family="Arial" font-size="10" text-anchor="middle" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke">HTTPS 443 · tarea</text><text x="815.0" y="498.0" font-family="Arial" font-size="10" text-anchor="middle" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke">diaria 02:00</text><rect x="30" y="420" width="380" height="170" rx="0" fill="#fafafa" stroke="#333333" stroke-width="1.2"/><text x="36" y="463.0" font-family="Arial" font-size="10" text-anchor="start" fill="#222">Decisiones que responden a RNF:</text><text x="36" y="476.0" font-family="Arial" font-size="10" text-anchor="start" fill="#222">• RNF-05 Seguridad: solo HTTPS 443 hacia internet;</text><text x="36" y="489.0" font-family="Arial" font-size="10" text-anchor="start" fill="#222">  el nodo de datos no tiene puerto expuesto.</text><text x="36" y="502.0" font-family="Arial" font-size="10" text-anchor="start" fill="#222">• RNF-04 Disponibilidad 99 %: health check de Render</text><text x="36" y="515.0" font-family="Arial" font-size="10" text-anchor="start" fill="#222">  reinicia el servicio si no responde.</text><text x="36" y="528.0" font-family="Arial" font-size="10" text-anchor="start" fill="#222">• RNF-11 Respaldo diario: copia cifrada a otro nodo.</text><text x="36" y="541.0" font-family="Arial" font-size="10" text-anchor="start" fill="#222">• RNF-03 Rendimiento: estáticos con caché del</text><text x="36" y="554.0" font-family="Arial" font-size="10" text-anchor="start" fill="#222">  navegador y service worker.</text></svg>