<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680"><rect width="100%" height="100%" fill="#ffffff"/><text x="600.0" y="25.0" font-family="Arial" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">SyP Web · Arquitectura de despliegue de la propuesta (ajustada desde la G2, con rubros del presupuesto B2)</text><rect x="42" y="78" width="280" height="210" rx="0" fill="#cfd8dc" stroke="#455a64" stroke-width="1.2"/><rect x="30" y="90" width="280" height="210" rx="0" fill="#eceff1" stroke="#455a64" stroke-width="1.5"/><text x="170.0" y="111.0" font-family="Arial" font-size="12" text-anchor="middle" fill="#222" font-weight="bold">«device» Navegador del cliente</text><text x="170.0" y="126.0" font-family="Arial" font-size="12" text-anchor="middle" fill="#222" font-weight="bold">y equipo del administrador</text><rect x="44" y="138" width="252" height="26" rx="0" fill="#ffffff" stroke="#90a4ae" stroke-width="1.2"/><text x="170.0" y="154.5" font-family="Arial" font-size="10" text-anchor="middle" fill="#222">Frontend web (HTML/CSS/JS)</text><rect x="44" y="170" width="252" height="26" rx="0" fill="#ffffff" stroke="#90a4ae" stroke-width="1.2"/><text x="170.0" y="186.5" font-family="Arial" font-size="10" text-anchor="middle" fill="#222">Service worker (caché)</text><rect x="44" y="202" width="252" height="26" rx="0" fill="#ffffff" stroke="#90a4ae" stroke-width="1.2"/><text x="170.0" y="218.5" font-family="Arial" font-size="10" text-anchor="middle" fill="#222">Panel administrativo</text><rect x="190" y="274" width="112" height="20" rx="0" fill="#fff59d" stroke="#f9a825" stroke-width="1.2"/><text x="246.0" y="287.5" font-family="Arial" font-size="10" text-anchor="middle" fill="#222" font-weight="bold">B2 fila 4 (equipo)</text><rect x="462" y="78" width="320" height="230" rx="0" fill="#cfd8dc" stroke="#455a64" stroke-width="1.2"/><rect x="450" y="90" width="320" height="230" rx="0" fill="#e8f5e9" stroke="#455a64" stroke-width="1.5