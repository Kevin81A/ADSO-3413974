 height="110" rx="0" fill="#f5f5f5" stroke="#455a64" stroke-width="1.5"/><text x="1020.0" y="118.5" font-family="Arial" font-size="12" text-anchor="middle" fill="#222" font-weight="bold">«node» Correo transaccional</text><rect x="894" y="138" width="252" height="26" rx="0" fill="#ffffff" stroke="#90a4ae" stroke-width="1.2"/><text x="1020.0" y="154.5" font-family="Arial" font-size="10" text-anchor="middle" fill="#222">Amazon SES (pago por uso)</text><rect x="1040" y="174" width="112" height="20" rx="0" fill="#fff59d" stroke="#f9a825" stroke-width="1.2"/><text x="1096.0" y="187.5" font-family="Arial" font-size="10" text-anchor="middle" fill="#222" font-weight="bold">B2 fila 8</text><rect x="892" y="238" width="280" height="110" rx="0" fill="#cfd8dc" stroke="#455a64" stroke-width="1.2"/><rect x="880" y="250" width="280" height="110" rx="0" fill="#f5f5f5" stroke="#455a64" stroke-width="1.5"/><text x="1020.0" y="278.5" font-family="Arial" font-size="12" text-anchor="middle" fill="#222" font-weight="bold">«node» Pasarela de pagos</text><rect x="894" y="298" width="252" height="26" rx="0" fill="#ffffff" stroke="#90a4ae" stroke-width="1.2"/><text x="1020.0" y="314.5" font-family="Arial" font-size="10" text-anchor="middle" fill="#222">Fase 2 · comisión por transacción</text><rect x="1040" y="334" width="112" height="20" rx="0" fill="#fff59d" stroke="#f9a825" stroke-width="1.2"/><text x="1096.0" y="347.5" font-family="Arial" font-size="10" text-anchor="middle" fill="#222" font-weight="bold">Excluida (§3)</text><rect x="30" y="360" width="280" height="60" rx="0" fill="#f5f5f5" stroke="#333333" stroke-width="1.2" stroke-dasharray="6,4"/><text x="170.0" y="387.0" font-family="Arial" font-size="12" text-anchor="middle" fill="#222">Dominio .com.co y DNS</text><text x="170.0" y="402.0" font-family="Arial" font-size="12" text-anchor="middle" fill="#222">(registrador)</text><rect x="200" y="396" width="102" height="20" rx="0" fill="#fff59d" stroke="#f9a825" stroke-width="1.2"/><text x="251.0" y="409.5" font-family="Arial" font-size="10" text-anchor="middle" fill="#222" font-weight="bold">B2 fila 10</text><path d="M310,195 L450,195" fill="none" stroke="#333" stroke-width="1.3"/><polygon points="439.0,200.0 450,195 439.0,190.0" fill="#333" stroke="#333"/><text x="380.0" y="181.0" font-family="Arial" font-size="10" text-anchor="middle" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke">HTTPS · TCP 443</text><text x="380.0" y="193.0" font-family="Arial" font-size="10" text-anchor="middle" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke">TLS 1.2+</text><path d="M170,360 L170,300" fill="none" stroke="#333" stroke-width="1.3"/><polygon points="175.0,311.0 170,300 165.0,311.0" fill="#333" stroke="#333"/><text x="198.0" y="330.0" font-family="Arial" font-size="10" text-anchor="middle" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke">DNS 53</text><path d="M610,320 L610,430" fill="none" stroke="#333" stroke-width="1.3"/><polygon points="605.0,419.0 610,430 615.0,419.0" fill="#333" stroke="#333"/><text x="680.0" y="375.0" font-family="Arial" font-size="10" text-anchor="middle" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke">E/S de archivo</text><text x="680.0" y="387.0" font-family="Arial" font-size="10" text-anchor="middle" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke">(montaje /var/data)</text><path d="M770,150 L880,150" fill="none" stroke="#333" stroke-width="1.3"/><polygon points="869.0,155.0 880,150 869.0,145.0" fill="#333" stroke="#333"/><text x="825.0" y="136.0" font-family="Arial" font-size="10" text-anchor="middle" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke">HTTPS 443</text><text x="825.0" y="148.0" font-family="Arial" font-size="10" text-anchor="middle" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke">(API SES)</text><path d="M770,290 L880,300" fill="none" stroke="#333" stroke-width="1.3"/><polygon points="868.6,304.0 880,300 869.5,294.0" fill="#333" stroke="#333"/><text x="825.0" y="287.0" font-family="Arial" font-size="10" text-anchor="middle" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke">HTTPS 443</text><path d="M750,500 L880,500" fill="none" stroke="#333" stroke-width="1.3"/><polygon points="869.0,505.0 880,500 869.0,495.0" fill="#333" stroke="#333"/><text x="815.0" y="486.0" font-family="Arial" font-size="10" text-anchor="middle" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke">HTTPS 443</text><text x="815.0" y="498.0" font-family="Arial" font-size="10" text-anchor="middle" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke">diario 02:00</text><rect x="30" y="470" width="400" height="180" rx="0" fill="#fafafa" stroke="#333333" stroke-width="1.2"/><text x="36" y="524.5" font-family="Arial" font-size="10" text-anchor="start" fill="#222">Ajustes frente a la G2:</text><text x="36" y="537.5" font-family="Arial" font-size="10" text-anchor="start" fill="#222">• El correo pasa de SMTP a la API de Amazon SES (elegida</text><text x="36" y="550.5" font-family="Arial" font-size="10" text-anchor="start" fill="#222">  en el comparativo B1) por HTTPS 443.</text><text x="36" y="563.5" font-family="Arial" font-size="10" text-anchor="start" fill="#222">• La pasarela de pagos queda para la fase 2 (excluida del</text><text x="36" y="576.5" font-family="Arial" font-size="10" text-anchor="start" fill="#222">  alcance y del presupuesto de esta propuesta).</text><text x="36" y="589.5" font-family="Arial" font-size="10" text-anchor="start" fill="#222">• Se agrega el dominio y DNS como componente con costo.</text><text x="36" y="602.5" font-family="Arial" font-size="10" text-anchor="start" fill="#222">• Cada nodo muestra su fila del presupuesto B2.</text></svg>