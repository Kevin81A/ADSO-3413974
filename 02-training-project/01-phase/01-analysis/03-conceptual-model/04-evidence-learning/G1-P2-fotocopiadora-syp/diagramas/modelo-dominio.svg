ext x="986" y="939.5" font-family="Arial" font-size="10" text-anchor="start" fill="#222">LíneaPedido = clase de asociación</text><text x="986" y="952.5" font-family="Arial" font-size="10" text-anchor="start" fill="#222">entre Pedido y Producto.</text><text x="986" y="965.5" font-family="Arial" font-size="10" text-anchor="start" fill="#222">Usuario es abstracta: se especializa</text><text x="986" y="978.5" font-family="Arial" font-size="10" text-anchor="start" fill="#222">en Cliente, Administrador y Técnico.</text><text x="986" y="991.5" font-family="Arial" font-size="10" text-anchor="start" fill="#222">Un pedido de invitado no tiene</text><text x="986" y="1004.5" font-family="Arial" font-size="10" text-anchor="start" fill="#222">Cliente (0..1).</text><text x="986" y="1017.5" font-family="Arial" font-size="10" text-anchor="start" fill="#222">Rombo negro = composición</text><text x="986" y="1030.5" font-family="Arial" font-size="10" text-anchor="start" fill="#222">(la variante y el ítem no existen</text><text x="986" y="1043.5" font-family="Arial" font-size="10" text-anchor="start" fill="#222">sin su producto o carrito).</text></svg>